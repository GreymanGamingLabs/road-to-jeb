<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Road to Jeb</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:,">
  <style>
    /* Styling to ensure the logo fits nicely on mobile header */
    .header-logo {
      display: block;
      max-width: 85%;
      width: 380px;
      height: auto;
      margin: 10px auto 15px auto;
    }
  </style>
</head>
<body>

  <header>
    <img src="TRTJ Head.png" alt="The Road to Jeb_" class="header-logo">
    <p>Answer Minecraft trivia to race to Jeb the Rainbow Sheep!</p>
  </header>

  <main>
    <div id="card" class="card">
      <div class="card-inner">
        <div class="card-front">
          <span class="badge">QUESTION</span>
          <p id="question">Loading...</p>
          <span class="subtext">Click the card to reveal the answer</span>
        </div>
        <div class="card-back">
          <span class="badge">ANSWER</span>
          <p id="answer">...</p>
        </div>
      </div>
    </div>

    <div class="controls">
      <button id="next">Next Question ➡️</button>
    </div>
  </main>

  <script src="questions.js"></script>
  <script src="script.js"></script>
</body>
</html>
