<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Road to Jeb_</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --dirt-bg: #3c2415;
      --panel-bg: #211c18;
      --card-bg: #4a3b32;
      --border-dark: #181412;
      --border-light: #6a574a;
      --p1-color: #ff4757;
      --p2-color: #2ed573;
      --p3-color: #1e90ff;
      --gold: #ffa502;
    }

    body {
      font-family: 'VT323', monospace;
      background-color: var(--dirt-bg);
      background-image: 
        linear-gradient(45deg, #331f12 25%, transparent 25%), 
        linear-gradient(-45deg, #331f12 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #331f12 75%),
        linear-gradient(-45deg, transparent 75%, #331f12 75%);
      background-size: 40px 40px;
      color: #ffffff;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    /* LOGO IMAGE STYLING */
    .game-logo {
      display: block;
      max-width: 90%;
      width: 450px;
      height: auto;
      margin: 10px auto 20px auto;
      filter: drop-shadow(4px 4px 0px #000);
    }

    /* MINECRAFT BUTTONS */
    button {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.75rem;
      color: white;
      background: #727272;
      border: 4px solid;
      border-color: #dbdbdb #3b3b3b #3b3b3b #dbdbdb;
      padding: 12px 14px;
      cursor: pointer;
      margin: 2px;
      text-shadow: 2px 2px #000;
      box-shadow: inset -2px -2px 0px 0px #212121;
    }

    button:active {
      border-color: #3b3b3b #dbdbdb #dbdbdb #3b3b3b;
      transform: translateY(2px);
    }

    .btn-p1 { background: var(--p1-color); }
    .btn-p2 { background: var(--p2-color); }
    .btn-p3 { background: var(--p3-color); }

    .board-container {
      width: 100%;
      max-width: 1000px;
    }

    /* CONTROL BAR AT TOP */
    .controls-bar {
      background: var(--panel-bg);
      border: 4px solid var(--border-light);
      padding: 12px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
      box-shadow: 0 8px 0px #000;
    }

    .player-control {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0,0,0,0.3);
      padding: 6px 12px;
      border-radius: 4px;
    }

    /* THE TRACK GRID */
    .track {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      background: rgba(0,0,0,0.5);
      padding: 15px;
      border: 4px solid #000;
      border-radius: 8px;
    }

    .space {
      background: var(--card-bg);
      border: 3px solid;
      border-color: var(--border-light) var(--border-dark) var(--border-dark) var(--border-light);
      height: 90px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 6px;
      position: relative;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }

    .space-num {
      font-size: 1.2rem;
      color: #aaa;
      align-self: flex-start;
      font-weight: bold;
    }

    .space-finish {
      border-color: var(--gold);
      background: #5c4308;
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      from { box-shadow: 0 0 5px var(--gold); }
      to { box-shadow: 0 0 20px var(--gold); }
    }

    .players-container {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    /* PLAYER TOKENS WITH GLOW */
    .player-token {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      box-sizing: border-box;
      border: 3px solid #fff;
    }

    .p1 { background: var(--p1-color); box-shadow: 0 0 8px var(--p1-color); }
    .p2 { background: var(--p2-color); box-shadow: 0 0 8px var(--p2-color); }
    .p3 { background: var(--p3-color); box-shadow: 0 0 8px var(--p3-color); }
  </style>
</head>
<body>

  <div class="board-container">
    <img src="TRTJ Head.png" alt="The Road to Jeb_" class="game-logo">
    
    <div class="controls-bar">
      <div class="player-control">
        <button class="btn-p1" onclick="step('p1', 1)">P1 +1</button>
        <button onclick="step('p1', -1)">-1</button>
      </div>
      <div class="player-control">
        <button class="btn-p2" onclick="step('p2', 1)">P2 +1</button>
        <button onclick="step('p2', -1)">-1</button>
      </div>
      <div class="player-control">
        <button class="btn-p3" onclick="step('p3', 1)">P3 +1</button>
        <button onclick="step('p3', -1)">-1</button>
      </div>
      <button onclick="resetBoard()" style="background: #ff4757;">RESET</button>
    </div>

    <div class="track" id="track"></div>
  </div>

  <script>
    const TOTAL_SPACES = 30;
    let positions = { p1: 1, p2: 1, p3: 1 };

    function buildTrack() {
      const trackEl = document.getElementById('track');
      trackEl.innerHTML = '';
      for (let i = 1; i <= TOTAL_SPACES; i++) {
        const isFinish = i === TOTAL_SPACES;
        trackEl.innerHTML += `
          <div class="space ${isFinish ? 'space-finish' : ''}">
            <span class="space-num">${i}</span>
            <div class="players-container" id="space-${i}"></div>
            ${isFinish ? '<span style="font-size:1.5rem;">🌈🐑</span>' : ''}
          </div>
        `;
      }
    }

    function step(player, amount) {
      positions[player] = Math.max(1, Math.min(TOTAL_SPACES, positions[player] + amount));
      renderBoard();

      if (positions[player] === TOTAL_SPACES) {
        setTimeout(() => alert(`🎉 PLAYER ${player.slice(1)} REACHED JEB_ AND WON!`), 100);
      }
    }

    function renderBoard() {
      for (let i = 1; i <= TOTAL_SPACES; i++) {
        const spaceEl = document.getElementById(`space-${i}`);
        if (spaceEl) spaceEl.innerHTML = '';
      }

      ['p1', 'p2', 'p3'].forEach(p => {
        const spaceEl = document.getElementById(`space-${positions[p]}`);
        if (spaceEl) {
          spaceEl.innerHTML += `<div class="player-token ${p}"></div>`;
        }
      });
    }

    function resetBoard() {
      positions = { p1: 1, p2: 1, p3: 1 };
      renderBoard();
    }

    // Initialize board on load
    buildTrack();
    renderBoard();
  </script>
</body>
</html>
